[project]
name = "rag-document-qa"
version = "1.0.0"
description = "Local retrieval-augmented question answering over your own documents"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `pytest` works the same as `python -m pytest`,
# which adds the working directory implicitly.
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
